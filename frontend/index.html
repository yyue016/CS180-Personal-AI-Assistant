<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Personal AI Assistant</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: #f1f5fd;
    }

    #settingsPage {
      height: 100vh;
      overflow-y: auto;
    }

    #profilePage {
      height: 100vh;
      overflow-y: auto;
      background: #f5f7fc;
    }
  </style>
</head>

<body>
  <div id="chatPage" class="chat-container">

    <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-1">🔵 Personal AI Assistant</h5>
        <small id="modelStatus" class="text-muted">Model: none</small>
      </div>

      <button id="settingsButton" class="btn btn-light" type="button">
        ⚙
      </button>
    </div>

    <div id="messages" class="chat-messages p-3">
      <div class="alert alert-primary">
        Hi! I'm your personal AI assistant.
      </div>
    </div>

    <form id="chatForm" class="d-flex gap-2 p-3">
      <input
        id="messageInput"
        class="form-control"
        placeholder="Ask while you work..."
        required
      >
      <button class="btn btn-primary" type="submit">
        Send
      </button>
    </form>

  </div>

  <div id="settingsPage" class="d-none p-3">
    <button id="backButton" class="btn btn-outline-secondary btn-sm mb-3">
      ← Back to Chat
    </button>

    <h5>Settings</h5>

    <div class="card mb-3">
      <div class="card-body">
        <h6>Profile</h6>
        <p class="small text-muted">Personal preferences</p>

        <button id="editProfileButton"
                class="btn btn-outline-primary btn-sm"
                type="button">
          Edit Profile
        </button>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h6>Documents</h6>
        <p class="small text-muted">Manage uploaded documents</p>
      </div>
    </div>
  </div>
  
  <!-- Profile Page -->
  <div id="profilePage" class="d-none p-3">
    <button id="backToSettings"
            class="btn btn-outline-secondary btn-sm mb-3"
            type="button">
      ← Back to Settings
    </button>

    <h5>Profile</h5>
    <p class="small text-muted">
      Customize your AI assistant.
    </p>

    <form id="profileForm">

      <div class="mb-3">
        <label for="profileName" class="form-label">
          Display Name
        </label>
        <input id="profileName"
               class="form-control"
               type="text"
               placeholder="Enter your name">
      </div>

      <div class="mb-3">
        <label for="profileLanguage" class="form-label">
          Language
        </label>
        <select id="profileLanguage" class="form-select">
          <option value="auto">Auto</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="profileTone" class="form-label">
          Tone
        </label>
        <select id="profileTone" class="form-select">
          <option value="friendly">Friendly</option>
          <option value="professional">Professional</option>
          <option value="casual">Casual</option>
          <option value="formal">Formal</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="profileLength" class="form-label">
          Answer Length
        </label>
        <select id="profileLength" class="form-select">
          <option value="balanced">Balanced</option>
          <option value="short">Short</option>
          <option value="detailed">Detailed</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="profileExamples" class="form-label">
          Example Preferences
        </label>
        <textarea id="profileExamples"
                  class="form-control"
                  rows="4"
                  placeholder="e.g. Include code examples when explaining programming concepts."></textarea>
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Save Profile
      </button>

      <div id="profileSaved"
           class="alert alert-success mt-3 d-none"
           role="status">
        Profile saved successfully!
      </div>

    </form>
  </div>


  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const bubble = document.createElement("div");
      bubble.className = "alert alert-secondary";
      bubble.textContent = text;

      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;

      input.value = "";
    });

    const chatPage = document.getElementById("chatPage");
    const settingsPage = document.getElementById("settingsPage");

    document.getElementById("settingsButton").addEventListener("click", () => {
    chatPage.classList.add("d-none");
    settingsPage.classList.remove("d-none");
    });

    document.getElementById("backButton").addEventListener("click", () => {
    settingsPage.classList.add("d-none");
    chatPage.classList.remove("d-none");
    });
    
    // Profile page
    const profilePage = document.getElementById("profilePage");
    const editProfileButton = document.getElementById("editProfileButton");
    const backToSettings = document.getElementById("backToSettings");
    const profileForm = document.getElementById("profileForm");
    const profileSaved = document.getElementById("profileSaved");

    // Open Profile
    editProfileButton.addEventListener("click", () => {
      settingsPage.classList.add("d-none");
      profilePage.classList.remove("d-none");
      profileSaved.classList.add("d-none");
    });

    // Return to Settings
    backToSettings.addEventListener("click", () => {
      profilePage.classList.add("d-none");
      settingsPage.classList.remove("d-none");
    });

    // Load saved Profile
    function loadProfile() {
      try {
        const saved = JSON.parse(
          localStorage.getItem("userProfile") || "null"
        );

        if (!saved) return;

        document.getElementById("profileName").value =
          saved.displayName || "";

        document.getElementById("profileLanguage").value =
          saved.language || "auto";

        document.getElementById("profileTone").value =
          saved.tone || "friendly";

        document.getElementById("profileLength").value =
          saved.answerLength || "balanced";

        document.getElementById("profileExamples").value =
          saved.examplePreferences || "";

      } catch (error) {
        console.error("Failed to load profile:", error);
      }
    }

    // Save Profile
    profileForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const profile = {
        displayName: document.getElementById("profileName").value.trim(),
        language: document.getElementById("profileLanguage").value,
        tone: document.getElementById("profileTone").value,
        answerLength: document.getElementById("profileLength").value,
        examplePreferences: document.getElementById("profileExamples").value.trim()
      };

      try {
        localStorage.setItem("userProfile", JSON.stringify(profile));
        profileSaved.classList.remove("d-none");
      } catch (error) {
        console.error("Failed to save profile:", error);
        alert("Failed to save profile.");
      }
    });

    loadProfile();

  </script>
</body>
</html>
