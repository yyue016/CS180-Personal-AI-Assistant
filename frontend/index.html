<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>personal AI</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="d-flex vh-100 flex-column justify-content-start">
    <div class="container-fluid">
        <div class="row d-flex justify-content-between align-items-center flex-nowrap py-3">
            <div class="col-auto">
                <h2 class="mb-0">Personal AI Assistant</h2>
                <p class="small text-muted mb-0">Model: None</p>
            </div>
            <div class="col-auto"><a class="btn btn-secondary" role="button" href="settings.html">Settings</a></div>
        </div>
    </div>
    <div class="container-fluid overflow-auto flex-grow-1" id="chatMessages" style="background: var(--bs-white);">
        <div class="d-flex justify-content-start">
            <div class="alert alert-secondary" role="alert"><span>Hello! How can I help you?</span></div>
        </div>
    </div>
    <div class="input-group d-flex flex-shrink-0 align-items-stretch p-2"><input class="form-control visually-hidden" type="file" id="fileUpload" accept=".pdf,.txt,.docx"><label class="form-label mb-0 py-0 input-group-text" for="fileUpload"><br><svg class="bi bi-paperclip" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"></path>
            </svg></label><input class="form-control" type="text" id="messageInput" placeholder="Type a message..."><button class="btn btn-primary" id="sendButton" type="button">Send</button></div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/chat.js"></script>
    <script src="assets/js/settings.js"></script>
</body>

</html>
